<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Royale</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 40%,#4d8b45 0,#28652f 35%,#163d20 100%);
}

/* आसमान */
#sky{
  position:absolute;
  width:100%;
  height:35%;
  background:linear-gradient(#62b8e8,#b9e5f5);
}

/* जमीन */
#ground{
  position:absolute;
  left:-20%;
  top:25%;
  width:140%;
  height:100%;
  background:
    repeating-linear-gradient(
      45deg,
      #37783a 0px,
      #37783a 35px,
      #3f843f 36px,
      #3f843f 70px
    );
  transform:perspective(500px) rotateX(12deg);
}

/* HUD */
#hud{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  color:white;
  z-index:10;
}

.box{
  background:rgba(0,0,0,.55);
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
}

/* खिलाड़ी */
#player{
  position:absolute;
  left:50%;
  top:52%;
  width:45px;
  height:65px;
  transform:translate(-50%,-50%);
  z-index:5;
}

.head{
  width:28px;
  height:28px;
  background:#f0b27a;
  border-radius:50%;
  margin:auto;
  border:3px solid #222;
}

.body{
  width:40px;
  height:35px;
  background:#263b8f;
  border-radius:8px 8px 4px 4px;
  margin:0 auto;
}

.gun{
  position:absolute;
  width:45px;
  height:8px;
  background:#222;
  right:-35px;
  top:40px;
  transform:rotate(-10deg);
  border-radius:5px;
}

/* दुश्मन */
.enemy{
  position:absolute;
  width:42px;
  height:60px;
  z-index:4;
}

.enemy .head{
  width:25px;
  height:25px;
}

.enemy .body{
  width:38px;
  height:32px;
  background:#9b2929;
}

/* निशाना */
#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:35px;
  height:35px;
  transform:translate(-50%,-50%);
  z-index:20;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
}

#crosshair:before{
  width:35px;
  height:2px;
  top:16px;
}

#crosshair:after{
  height:35px;
  width:2px;
  left:16px;
}

/* गोली बटन */
#shoot{
  position:absolute;
  right:25px;
  bottom:35px;
  width:80px;
  height:80px;
  border-radius:50%;
  border:3px solid white;
  background:rgba(190,30,30,.8);
  color:white;
  font-weight:bold;
  font-size:16px;
  z-index:30;
}

/* जॉयस्टिक */
#joystick{
  position:absolute;
  left:25px;
  bottom:35px;
  width:100px;
  height:100px;
  border-radius:50%;
  background:rgba(0,0,0,.35);
  border:2px solid rgba(255,255,255,.5);
  z-index:30;
}

#stick{
  position:absolute;
  width:45px;
  height:45px;
  border-radius:50%;
  background:rgba(255,255,255,.65);
  left:27px;
  top:27px;
}

/* संदेश */
#message{
  position:absolute;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,.55);
  padding:10px 18px;
  border-radius:10px;
  z-index:20;
}
</style>
</head>

<body>

<div id="game">

  <div id="sky"></div>
  <div id="ground"></div>

  <div id="hud">
    <div class="box">❤️ HP: <span id="hp">100</span></div>
    <div class="box">👥 दुश्मन: <span id="enemies">3</span></div>
  </div>

  <div id="message">BATTLE ROYALE</div>

  <div id="player">
    <div class="head"></div>
    <div class="body"></div>
    <div class="gun"></div>
  </div>

  <div class="enemy" style="left:25%;top:40%;">
    <div class="head"></div>
    <div class="body"></div>
  </div>

  <div class="enemy" style="left:70%;top:35%;">
    <div class="head"></div>
    <div class="body"></div>
  </div>

  <div class="enemy" style="left:60%;top:65%;">
    <div class="head"></div>
    <div class="body"></div>
  </div>

  <div id="crosshair"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="shoot">FIRE</button>

</div>

<script>

let hp = 100;
let enemyCount = 3;

const player = document.getElementById("player");
const hpText = document.getElementById("hp");
const enemyText = document.getElementById("enemies");
const shoot = document.getElementById("shoot");

let x = 50;
let y = 52;

function movePlayer(dx,dy){

  x += dx;
  y += dy;

  x = Math.max(5,Math.min(95,x));
  y = Math.max(25,Math.min(90,y));

  player.style.left = x + "%";
  player.style.top = y + "%";
}

/* मोबाइल जॉयस्टिक */
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let dragging = false;

joystick.addEventListener("touchstart",()=>{
  dragging = true;
});

joystick.addEventListener("touchmove",(e)=>{

  if(!dragging) return;

  const touch = e.touches[0];
  const rect = joystick.getBoundingClientRect();

  let dx = touch.clientX - (rect.left + 50);
  let dy = touch.clientY - (rect.top + 50);

  const distance = Math.sqrt(dx*dx + dy*dy);

  if(distance > 30){
    dx = dx / distance * 30;
    dy = dy / distance * 30;
  }

  stick.style.left = (27 + dx) + "px";
  stick.style.top = (27 + dy) + "px";

  movePlayer(dx/8,dy/8);
});

joystick.addEventListener("touchend",()=>{
  dragging = false;
  stick.style.left = "27px";
  stick.style.top = "27px";
});

/* शूटिंग */
shoot.addEventListener("click",()=>{

  if(enemyCount > 0){

    enemyCount--;
    enemyText.textContent = enemyCount;

    shoot.textContent = "HIT!";

    setTimeout(()=>{
      shoot.textContent = "FIRE";
    },500);

  }else{

    document.getElementById("message").textContent =
      "🏆 VICTORY!";

  }

});

</script>

</body>
</html>
